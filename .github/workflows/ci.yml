name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: falchion_hrms_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check server syntax
        run: |
          find server/src server/test -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Run backend tests
        run: npm test

      - name: Apply MySQL migrations in CI
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: falchion_hrms_ci
          DB_USER: root
          DB_PASSWORD: root
        run: npm run db:migrate

      - name: Seed and verify MySQL in CI
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: falchion_hrms_ci
          DB_USER: root
          DB_PASSWORD: root
        run: |
          npm run db:seed
          npm run db:verify --workspace server

      - name: Build frontend
        run: npm run build

      - name: Run frontend smoke contracts
        run: npm run test:smoke --workspace client


      - name: Build production API image
        run: docker build -f server/Dockerfile -t falchion-xeniaa-api:ci server

      - name: Inspect production API container user
        run: test "$(docker run --rm --entrypoint id falchion-xeniaa-api:ci -u)" = "1000"
