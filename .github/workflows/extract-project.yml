name: Extract HRMS Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f falchion-xeniaa-complete.zip
          rm -rf /tmp/hrms-extract
          mkdir -p /tmp/hrms-extract
          unzip -q falchion-xeniaa-complete.zip -d /tmp/hrms-extract
          test -d /tmp/hrms-extract/falchion-xeniaa
          cp -a /tmp/hrms-extract/falchion-xeniaa/. .
          rm -rf /tmp/hrms-extract
          rm -f falchion-xeniaa-complete.zip
          rm -f .github/workflows/extract-project.yml

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract HRMS project source files"
          git push
