name: HRMS UAT Sign-off

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag under UAT review"
        required: true
        type: string
      business_owner:
        description: "HR/business owner approving UAT"
        required: true
        type: string
      test_window:
        description: "UAT test window, for example 2026-10-06"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: uat-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  automated-gate:
    name: Automated UAT gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git rev-parse --verify "refs/tags/${{ inputs.release_tag }}" >/dev/null
          echo "RELEASE_SHA=$(git rev-list -n 1 "refs/tags/${{ inputs.release_tag }}")" >> "$GITHUB_ENV"

      - name: Verify release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

      - name: Verify CI and Playwright passed for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in CI "Playwright E2E"; do
            count="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${workflow}" --commit "${RELEASE_SHA}" --json conclusion --jq '[.[] | select(.conclusion=="success")] | length')"
            if [[ "${count}" -lt 1 ]]; then
              echo "::error::No successful ${workflow} run found for ${RELEASE_SHA}"
              exit 1
            fi
          done

      - name: Publish UAT sign-off record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uat-signoff
          cat > uat-signoff/uat-signoff.md <<EOF
          # HRMS UAT Sign-off

          - Release: ${{ inputs.release_tag }}
          - Release SHA: ${RELEASE_SHA}
          - Business owner: ${{ inputs.business_owner }}
          - Test window: ${{ inputs.test_window }}
          - Automated CI gate: PASS
          - Playwright E2E gate: PASS
          - Environment approval: PASS
          - Workflow run: ${GITHUB_RUN_ID}
          EOF

      - name: Upload UAT sign-off artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrms-uat-signoff-${{ inputs.release_tag }}
          path: uat-signoff/uat-signoff.md
          retention-days: 365
