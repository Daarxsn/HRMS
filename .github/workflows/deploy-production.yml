name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag. Defaults to the commit SHA."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, deploy, verify
    runs-on: ubuntu-latest
    environment: production

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      API_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATION_JOB: ${{ vars.CLOUD_RUN_MIGRATION_JOB }}
      CLOUD_SQL_CONNECTION: ${{ vars.CLOUD_SQL_CONNECTION }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      DB_PASSWORD_SECRET: ${{ vars.DB_PASSWORD_SECRET }}
      JWT_SECRET_NAME: ${{ vars.JWT_SECRET_NAME }}
      DB_PASSWORD_SECRET_VERSION: ${{ vars.DB_PASSWORD_SECRET_VERSION }}
      JWT_SECRET_VERSION: ${{ vars.JWT_SECRET_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PROJECT_ID REGION AR_REPOSITORY API_SERVICE MIGRATION_JOB
            CLOUD_SQL_CONNECTION RUNTIME_SERVICE_ACCOUNT WIF_PROVIDER
            DB_NAME DB_USER GCS_BUCKET APP_ORIGIN GOOGLE_CLIENT_ID
            DB_PASSWORD_SECRET JWT_SECRET_NAME
            DB_PASSWORD_SECRET_VERSION JWT_SECRET_VERSION
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production repository/environment variable: ${name}"
              exit 1
            fi
          done

      - name: Build API image in Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ inputs.image_tag }}"
          IMAGE_TAG="${IMAGE_TAG:-${GITHUB_SHA}}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/falchion-xeniaa-api:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          gcloud builds submit server             --project="${PROJECT_ID}"             --tag="${IMAGE_URI}"

      - name: Apply database migrations with Cloud Run Job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${MIGRATION_JOB}"             --project="${PROJECT_ID}"             --region="${REGION}"             --image="${IMAGE_URI}"             --service-account="${RUNTIME_SERVICE_ACCOUNT}"             --set-cloudsql-instances="${CLOUD_SQL_CONNECTION}"             --set-env-vars="NODE_ENV=production,DB_SOCKET_PATH=/cloudsql/${CLOUD_SQL_CONNECTION},DB_NAME=${DB_NAME},DB_USER=${DB_USER},GCS_BUCKET=${GCS_BUCKET},GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID},APP_ORIGIN=${APP_ORIGIN},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},DEMO_AUTH_ENABLED=false"             --set-secrets="DB_PASSWORD=${DB_PASSWORD_SECRET}:${DB_PASSWORD_SECRET_VERSION},JWT_SECRET=${JWT_SECRET_NAME}:${JWT_SECRET_VERSION}"             --command="node"             --args="src/migrate.js"             --tasks=1             --max-retries=1             --task-timeout=10m             --cpu=1             --memory=512Mi
          gcloud run jobs execute "${MIGRATION_JOB}"             --project="${PROJECT_ID}"             --region="${REGION}"             --wait

      - name: Deploy API to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${API_SERVICE}"             --project="${PROJECT_ID}"             --region="${REGION}"             --image="${IMAGE_URI}"             --port=8080             --service-account="${RUNTIME_SERVICE_ACCOUNT}"             --add-cloudsql-instances="${CLOUD_SQL_CONNECTION}"             --allow-unauthenticated             --set-env-vars="NODE_ENV=production,PORT=8080,APP_ORIGIN=${APP_ORIGIN},GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID},DB_NAME=${DB_NAME},DB_USER=${DB_USER},DB_SOCKET_PATH=/cloudsql/${CLOUD_SQL_CONNECTION},GCS_BUCKET=${GCS_BUCKET},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},DEMO_AUTH_ENABLED=false"             --set-secrets="DB_PASSWORD=${DB_PASSWORD_SECRET}:${DB_PASSWORD_SECRET_VERSION},JWT_SECRET=${JWT_SECRET_NAME}:${JWT_SECRET_VERSION}"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          API_URL="$(gcloud run services describe "${API_SERVICE}"             --project="${PROJECT_ID}"             --region="${REGION}"             --format="value(status.url)")"
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20             "${API_URL}/api/health/live"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20             "${API_URL}/api/health/ready"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Image: ${IMAGE_URI}"
            echo "- Cloud Run service: ${API_SERVICE}"
            echo "- API URL: ${API_URL}"
            echo "- Database migrations: completed"
            echo "- Liveness: passed"
            echo "- Readiness: passed"
          } >> "$GITHUB_STEP_SUMMARY"
