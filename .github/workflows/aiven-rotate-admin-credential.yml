name: Rotate Exposed Aiven Admin Credential

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROTATE-EXPOSED-AIVEN-ADMIN to authorize the credential rotation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aiven-admin-credential-rotation
  cancel-in-progress: false

jobs:
  rotate:
    if: ${{ inputs.confirmation == 'ROTATE-EXPOSED-AIVEN-ADMIN' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      AIVEN_PROJECT: ${{ vars.AIVEN_PROJECT }}
      AIVEN_SERVICE: ${{ vars.AIVEN_SERVICE }}
      AIVEN_ADMIN_DB_USER: ${{ vars.AIVEN_ADMIN_DB_USER }}
      AIVEN_RUNTIME_DB_USER: ${{ vars.AIVEN_RUNTIME_DB_USER }}
      AIVEN_MIGRATION_DB_USER: ${{ vars.AIVEN_MIGRATION_DB_USER }}
      AIVEN_AUDIT_DB_USER: ${{ vars.AIVEN_AUDIT_DB_USER }}
      AIVEN_DB_HOST: ${{ vars.AIVEN_DB_HOST }}
      AIVEN_DB_PORT: ${{ vars.AIVEN_DB_PORT }}
      AIVEN_DB_NAME: ${{ vars.AIVEN_DB_NAME }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}

    steps:
      - name: Validate target and secret readiness
        shell: bash
        env:
          AIVEN_API_TOKEN_PRESENT: ${{ secrets.AIVEN_API_TOKEN != '' }}
          ADMIN_PASSWORD_PRESENT: ${{ secrets.AIVEN_ADMIN_DB_PASSWORD != '' }}
          DB_SSL_CA_PRESENT: ${{ secrets.AIVEN_DB_SSL_CA != '' }}
          VERCEL_TOKEN_PRESENT: ${{ secrets.VERCEL_TOKEN != '' }}
          SECRET_WRITER_PRESENT: ${{ secrets.ACTIONS_SECRETS_WRITE_TOKEN != '' }}
        run: |
          set -euo pipefail
          required=(
            AIVEN_PROJECT AIVEN_SERVICE AIVEN_ADMIN_DB_USER AIVEN_RUNTIME_DB_USER
            AIVEN_MIGRATION_DB_USER AIVEN_AUDIT_DB_USER AIVEN_DB_HOST AIVEN_DB_PORT
            AIVEN_DB_NAME VERCEL_PROJECT_ID VERCEL_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected production configuration: ${name}"
              exit 1
            fi
          done
          [[ "${AIVEN_DB_PORT}" =~ ^[0-9]+$ ]]
          [[ "${AIVEN_DB_PORT}" -ge 1 && "${AIVEN_DB_PORT}" -le 65535 ]]
          [[ "${AIVEN_PROJECT}" != *"/"* && "${AIVEN_SERVICE}" != *"/"* ]]
          [[ "${AIVEN_ADMIN_DB_USER}" != "${AIVEN_RUNTIME_DB_USER}" ]]
          for flag in AIVEN_API_TOKEN_PRESENT ADMIN_PASSWORD_PRESENT DB_SSL_CA_PRESENT VERCEL_TOKEN_PRESENT SECRET_WRITER_PRESENT; do
            if [[ "${!flag}" != "true" ]]; then
              echo "::error::Required production secret is missing: ${flag}"
              exit 1
            fi
          done

      - name: Checkout reviewed main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without production secrets
        run: npm ci

      - name: Verify Aiven service, users, and recent backup
        shell: bash
        env:
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          service_json="$RUNNER_TEMP/aiven-service.json"
          users_json="$RUNNER_TEMP/aiven-users.json"
          backups_json="$RUNNER_TEMP/aiven-backups.json"
          trap 'rm -f "$service_json" "$users_json" "$backups_json" "$RUNNER_TEMP/aiven-usernames.txt"' EXIT
          base="https://api.aiven.io/v1/project/${AIVEN_PROJECT}/service/${AIVEN_SERVICE}"
          if ! curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${AIVEN_API_TOKEN}" "$base" -o "$service_json" 2>/dev/null; then
            echo "::error::Aiven service metadata check failed. No password has been rotated."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${AIVEN_API_TOKEN}" "$base/user" -o "$users_json" 2>/dev/null; then
            echo "::error::Aiven user inventory check failed. No password has been rotated."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${AIVEN_API_TOKEN}" "$base/backups" -o "$backups_json" 2>/dev/null; then
            echo "::error::Aiven backup inventory check failed. No password has been rotated."
            exit 1
          fi
          service_type="$(jq -r '.service.service_type // .service_type // empty' "$service_json")"
          service_state="$(jq -r '.service.state // .state // empty' "$service_json")"
          if [[ "${service_type,,}" != "mysql" || "${service_state^^}" != "RUNNING" ]]; then
            echo "::error::The Aiven target is not a running MySQL service. No password has been rotated."
            exit 1
          fi
          jq -e '(.users // .service_users // []) | type == "array" and length > 0' "$users_json" >/dev/null || {
            echo "::error::Aiven user inventory response was invalid. No password has been rotated."
            exit 1
          }
          jq -r '(.users // .service_users // [])[] | (.username // .user_name // empty)' "$users_json" > "$RUNNER_TEMP/aiven-usernames.txt"
          for name in "$AIVEN_ADMIN_DB_USER" "$AIVEN_RUNTIME_DB_USER" "$AIVEN_MIGRATION_DB_USER" "$AIVEN_AUDIT_DB_USER"; do
            if ! grep -Fxq "$name" "$RUNNER_TEMP/aiven-usernames.txt"; then
              echo "::error::Required purpose-specific database accounts are not all present. No password has been rotated."
              exit 1
            fi
          done
          if [[ "$AIVEN_ADMIN_DB_USER" == "$AIVEN_RUNTIME_DB_USER" ||
                "$AIVEN_ADMIN_DB_USER" == "$AIVEN_MIGRATION_DB_USER" ||
                "$AIVEN_ADMIN_DB_USER" == "$AIVEN_AUDIT_DB_USER" ||
                "$AIVEN_RUNTIME_DB_USER" == "$AIVEN_MIGRATION_DB_USER" ||
                "$AIVEN_RUNTIME_DB_USER" == "$AIVEN_AUDIT_DB_USER" ||
                "$AIVEN_MIGRATION_DB_USER" == "$AIVEN_AUDIT_DB_USER" ]]; then
            echo "::error::Database users are not distinct. No password has been rotated."
            exit 1
          fi
          backup_count="$(jq '(.backups // .service.backups // []) | length' "$backups_json")"
          if [[ ! "$backup_count" =~ ^[0-9]+$ || "$backup_count" -lt 1 ]]; then
            echo "::error::No Aiven backup is listed. No password has been rotated."
            exit 1
          fi
          latest="$(jq -r '(.backups // .service.backups // []) | map(.backup_time // .time // .start_time // .created_at // "") | map(select(. != "")) | sort | last // empty' "$backups_json")"
          if [[ -z "$latest" ]]; then
            echo "::error::Aiven returned no parseable backup timestamp. No password has been rotated."
            exit 1
          fi
          normalised="$latest"
          if [[ "$latest" =~ ^([0-9]{8})T([0-9]{6})[0-9]*Z$ ]]; then
            d="${BASH_REMATCH[1]}"; t="${BASH_REMATCH[2]}"
            normalised="${d:0:4}-${d:4:2}-${d:6:2}T${t:0:2}:${t:2:2}:${t:4:2}Z"
          fi
          backup_epoch="$(date -u -d "$normalised" +%s 2>/dev/null)" || {
            echo "::error::Backup freshness could not be parsed. No password has been rotated."
            exit 1
          }
          age_hours="$(( ($(date -u +%s) - backup_epoch) / 3600 ))"
          if (( age_hours < 0 || age_hours > 48 )); then
            echo "::error::The latest listed Aiven backup is older than 48 hours. No password has been rotated."
            exit 1
          fi
          echo "Aiven running service, account separation, and backup freshness: PASS"

      - name: Verify live Vercel runtime identity and readiness
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          env_json="$RUNNER_TEMP/vercel-env.json"
          deployments_json="$RUNNER_TEMP/vercel-deployments.json"
          trap 'rm -f "$env_json" "$deployments_json"' EXIT
          if ! curl --fail --silent --show-error --max-time 30             -H "Authorization: Bearer ${VERCEL_TOKEN}"             "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&target=production&decrypt=true"             -o "$env_json" 2>/dev/null; then
            echo "::error::Could not verify Vercel production environment. No password has been rotated."
            exit 1
          fi
          deployed_db_user="$(jq -r '[.envs[]? | select(.key == "DB_USER") | select((.target // []) | index("production")) | .value // empty][0] // empty' "$env_json")"
          if [[ "$deployed_db_user" != "$AIVEN_RUNTIME_DB_USER" || "$deployed_db_user" == "$AIVEN_ADMIN_DB_USER" ]]; then
            echo "::error::Vercel production is not verified to use the distinct runtime account. No password has been rotated."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 30             -H "Authorization: Bearer ${VERCEL_TOKEN}"             "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&target=production&limit=1"             -o "$deployments_json" 2>/dev/null; then
            echo "::error::Could not verify the production deployment commit. No password has been rotated."
            exit 1
          fi
          live_sha="$(jq -r '.deployments[0].meta.githubCommitSha // .deployments[0].gitSource.sha // empty' "$deployments_json")"
          live_url="$(jq -r '.deployments[0].url // empty' "$deployments_json")"
          if [[ -z "$live_sha" || -z "$live_url" || "$live_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The latest Vercel production deployment does not match this commit. No password has been rotated."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 20 "https://${live_url}/api/health/ready" >/dev/null 2>&1; then
            echo "::error::Live API readiness failed. No password has been rotated."
            exit 1
          fi
          echo "Live Vercel DB_USER is the non-admin runtime account and deployed API is ready: PASS"

      - name: Rotate admin password, save the replacement, and verify old credential rejection
        shell: bash
        env:
          DB_HOST: ${{ vars.AIVEN_DB_HOST }}
          DB_PORT: ${{ vars.AIVEN_DB_PORT }}
          DB_NAME: ${{ vars.AIVEN_DB_NAME }}
          DB_USER: ${{ vars.AIVEN_ADMIN_DB_USER }}
          AIVEN_ADMIN_DB_PASSWORD: ${{ secrets.AIVEN_ADMIN_DB_PASSWORD }}
          AIVEN_DB_SSL_CA: ${{ secrets.AIVEN_DB_SSL_CA }}
          ACTIONS_SECRETS_WRITE_TOKEN: ${{ secrets.ACTIONS_SECRETS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import mysql from 'mysql2/promise';
          import { execFileSync } from 'node:child_process';

          const oldPassword = process.env.AIVEN_ADMIN_DB_PASSWORD;
          const repo = process.env.GITHUB_REPOSITORY;
          if (!oldPassword || !repo || !process.env.ACTIONS_SECRETS_WRITE_TOKEN) {
            console.error('Credential rotation prerequisites were missing; no change was attempted.');
            process.exit(1);
          }
          const options = (password) => ({
            host:process.env.DB_HOST, port:Number(process.env.DB_PORT), database:process.env.DB_NAME,
            user:process.env.DB_USER, password,
            ssl:{ca:process.env.AIVEN_DB_SSL_CA,rejectUnauthorized:true,minVersion:'TLSv1.2'},
            connectTimeout:10000
          });
          const setProtectedSecret = (value) => execFileSync('gh', [
            'secret','set','AIVEN_ADMIN_DB_PASSWORD','--env','production','--repo',repo
          ], {
            input:value, encoding:'utf8',
            env:{...process.env,GH_TOKEN:process.env.ACTIONS_SECRETS_WRITE_TOKEN}
          });
          const quote = (value) => "'" + String(value).replaceAll('\\','\\\\').replaceAll("'","\\'") + "'";
          let connection;
          let changed = false;
          let secretChanged = false;
          let newPassword;
          let accountUser;
          let accountHost;
          try {
            connection = await mysql.createConnection(options(oldPassword));
            const [identityRows] = await connection.query('SELECT DATABASE() AS databaseName, CURRENT_USER() AS currentAccount');
            if (identityRows[0]?.databaseName !== process.env.DB_NAME) throw new Error('database mismatch');
            const account = String(identityRows[0]?.currentAccount || '');
            const splitAt = account.lastIndexOf('@');
            accountUser = account.slice(0,splitAt);
            accountHost = account.slice(splitAt+1);
            if (splitAt < 1 || accountUser !== process.env.DB_USER ||
                !/^[A-Za-z0-9_]+$/.test(accountUser) || !/^[A-Za-z0-9.%_-]+$/.test(accountHost)) {
              throw new Error('unexpected current user identity');
            }

            newPassword = crypto.randomBytes(48).toString('base64url');
            setProtectedSecret(newPassword);
            secretChanged = true;

            const alter = (password) =>
              'ALTER USER ' + quote(accountUser) + '@' + quote(accountHost) + ' IDENTIFIED BY ' + quote(password);
            await connection.query(alter(newPassword));
            changed = true;

            let newConnection;
            try {
              newConnection = await mysql.createConnection(options(newPassword));
              const [newIdentityRows] = await newConnection.query('SELECT DATABASE() AS databaseName, CURRENT_USER() AS currentAccount');
              if (newIdentityRows[0]?.databaseName !== process.env.DB_NAME ||
                  !String(newIdentityRows[0]?.currentAccount || '').startsWith(accountUser + '@')) {
                throw new Error('replacement identity mismatch');
              }
            } catch {
              let rollbackSucceeded = false;
              try {
                await connection.query(alter(oldPassword));
                changed = false;
                rollbackSucceeded = true;
              } catch {}
              if (rollbackSucceeded) {
                try { setProtectedSecret(oldPassword); secretChanged = false; }
                catch {
                  console.error('Replacement login failed. Database rollback succeeded but protected-secret rollback failed; reconcile the protected secret before use.');
                  process.exit(1);
                }
                console.error('Replacement login failed; the database password and protected secret were rolled back to the previous credential.');
                process.exit(1);
              }
              console.error('Replacement login could not be verified after the change. The protected secret contains the generated replacement; do not expose it. Verify the credential from the Aiven console before any further changes.');
              process.exit(1);
            } finally {
              if (newConnection) await newConnection.end().catch(()=>{});
            }

            let oldWasRejected = false;
            try {
              const oldConnection = await mysql.createConnection(options(oldPassword));
              await oldConnection.end();
            } catch (error) {
              if (error?.code === 'ER_ACCESS_DENIED_ERROR' || Number(error?.errno) === 1045) oldWasRejected = true;
              else {
                console.error('The replacement was validated, but the old credential test failed for a non-authentication reason. The protected secret remains the generated replacement.');
                process.exit(1);
              }
            }
            if (!oldWasRejected) {
              console.error('The replacement credential works but the old credential was still accepted. Rotation is not verified; the protected secret remains the replacement.');
              process.exit(1);
            }
            console.log('Admin password rotation: PASS. Replacement is stored in the protected production secret; the old password is rejected; runtime DB_USER remains separate. No credential values were logged.');
          } catch (error) {
            if (!changed && secretChanged && newPassword) {
              let newCredentialWorks = false;
              let oldCredentialWorks = false;
              let probe;
              try {
                probe = await mysql.createConnection(options(newPassword));
                newCredentialWorks = true;
              } catch {}
              finally { if (probe) await probe.end().catch(()=>{}); }
              probe = undefined;
              try {
                probe = await mysql.createConnection(options(oldPassword));
                oldCredentialWorks = true;
              } catch {}
              finally { if (probe) await probe.end().catch(()=>{}); }

              if (oldCredentialWorks && !newCredentialWorks) {
                try {
                  setProtectedSecret(oldPassword);
                  secretChanged = false;
                } catch {
                  console.error('Database still accepts the previous credential but the protected-secret rollback failed. Reconcile the AIVEN_ADMIN_DB_PASSWORD environment secret using the credential vault.');
                  process.exit(1);
                }
              } else {
                console.error('Credential change outcome is ambiguous or the replacement already works. The protected secret was left at the generated replacement; verify the database login from the Aiven console before further changes.');
                process.exit(1);
              }
            }
            const code = typeof error?.code === 'string' ? error.code : 'ROTATION_FAILED';
            console.error('Admin password rotation did not complete. Error category: ' + code + '. No credential values or raw database error details were logged.');
            process.exit(1);
          } finally {
            if (connection) await connection.end().catch(()=>{});
          }
          NODE

      - name: Record credential rotation result
        if: always()
        shell: bash
        run: |
          {
            echo "## Aiven admin credential rotation"
            echo ""
            echo "- Source commit: `$GITHUB_SHA`"
            echo "- Target identity checks: see preceding step results"
            echo "- Runtime account: verified as a distinct non-admin account before rotation"
            echo "- Password replacement: verified only if the rotation step passed"
            echo "- No credentials are printed in workflow output"
          } >> "$GITHUB_STEP_SUMMARY"
